<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Patents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --card:#f9f8f5; --band:#e9e5dd; --line:#dcd8d0;
  --ink:#1c1a17; --ink2:#4a4640; --mute:#8a857c; --faint:#bdb7ad;
  --kor:#1f6fd1; --mex:#c8541f; --gtm:#6a3fc1;
  --n1:#2f2c28; --n2:#8f897f; --n3:#d6d1c7;
  --out:cubic-bezier(.2,.75,.2,1); --spring:cubic-bezier(.3,1.6,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9d5cc;font-family:Archivo,system-ui,sans-serif;color:var(--ink);overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1334px;height:750px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;overflow:hidden;transition:opacity .45s var(--out)}
.slide.on{opacity:1;pointer-events:auto}
.A{position:absolute}
.cap{font-family:"Archivo Narrow",sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:15px;color:var(--mute)}
.h{font-weight:800;letter-spacing:-.035em;line-height:1.02}
.it{font-family:Newsreader,serif;font-style:italic;font-weight:400}
.sub{font-size:22px;line-height:1.4;color:var(--ink2)}
.rule{position:absolute;height:1px;background:var(--line)}
.card{position:absolute;left:72px;top:73px;width:400px;height:563px;background:var(--card);border:1px solid var(--line);padding:38px 30px}
.big{font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.foot{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--band);display:flex;align-items:center;padding:0 72px;
  font-family:"Archivo Narrow",sans-serif;font-size:13px;color:var(--mute);letter-spacing:.02em}
.road{position:absolute;right:72px;top:62px;display:flex;gap:22px;font-family:"Archivo Narrow",sans-serif;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#c9c3b8}
.road b{color:var(--ink);position:relative}
.road b::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--ink)}
svg{overflow:visible}
svg text{font-family:"Archivo Narrow",sans-serif}
.ph{background:#fbe7a6;padding:0 4px}
#nav{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:5;opacity:.3;transition:opacity .2s}#nav:hover{opacity:1}
#nav button{font:600 13px "Archivo Narrow",sans-serif;letter-spacing:.1em;border:0;background:rgba(28,26,23,.85);color:#fff;
  padding:9px 14px;border-radius:999px;cursor:pointer;transition:transform .18s var(--spring)}
#nav button:active{transform:scale(.88);transition-duration:.06s}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:rgba(28,26,23,.94);color:#f3f1ec;z-index:6;
  padding:18px 28px 22px;font:16px/1.5 Archivo,sans-serif;transform:translateY(105%);transition:transform .35s var(--out)}
#notes.show{transform:none}
#notes .who{font:700 13px "Archivo Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f0a07a;margin-bottom:6px}
#notes b{color:#fff}
#tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:#fff;font:500 14px/1.4 Archivo,sans-serif;
  padding:8px 11px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap}
#tip.show{opacity:1}
#tip b{font-family:"Archivo Narrow";letter-spacing:.08em;text-transform:uppercase;font-size:12px;display:block;opacity:.7}

/* Motion: a simple "appear" on everything (Storytelling Ses. 3-4); the one big motion is the zoom on slide 6 */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ap{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-origin:left center;transform-box:fill-box}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.on .r{animation:rise .6s var(--out) both;animation-delay:var(--t,0ms)}
.slide.on .ap{animation:ap .45s ease both;animation-delay:var(--t,0ms)}
.slide.on .draw{animation:draw var(--dur,1.2s) cubic-bezier(.45,0,.2,1) both;animation-delay:var(--t,0ms)}
.slide.on .grow{animation:grow var(--dur,1s) var(--out) both;animation-delay:var(--t,0ms)}
@media (prefers-reduced-motion:reduce){.slide *{animation:none!important}.draw{stroke-dashoffset:0}}
@media print{
  @page{size:1334px 750px;margin:0}
  html,body{overflow:visible;background:var(--bg)}
  #viewport{position:static;display:block}
  #stage{transform:none!important;width:auto;height:auto}
  .slide{position:relative;opacity:1;width:1334px;height:750px;page-break-after:always;break-after:page}
  .slide *{animation:none!important}
  .draw{stroke-dashoffset:0}
  #nav,#tip,#notes{display:none}
}
</style>
</head>
<body>

<div id="nav"><button id="pv" aria-label="Previous slide">‹</button><button id="nt" aria-label="Speaker notes">N</button><button id="nx" aria-label="Next slide">›</button></div>

<script>
// ---------- Data: World Bank WDI via api.worldbank.org, pulled 11 Nov 2026 ----------
const D={"pat":{"KOR":[1241,1319,1556,1599,1997,2702,3640,4871,5696,7020,9082,13253,15951,21449,28554,59228,68405,67359,50596,55970,72831,73714,76570,90313,105250,122188,125476,128701,127114,127316,131805,138034,148136,159978,164073,167275,163424,159084,162561,171603,180477,186245,183748,191142,195786],"MEX":[704,765,550,730,688,590,629,742,652,757,661,564,565,553,498,432,386,420,453,455,431,534,526,468,565,584,574,629,685,822,951,1065,1294,1210,1246,1364,1310,1334,1555,1305,1132,1117,983,978,1172],"BRA":[2149,2171,2116,2302,2062,1954,1855,2451,2338,2323,2389,2319,2100,2429,2269,2707,2611,2756,2491,2816,3179,3439,3481,3866,4044,4054,3956,4194,4280,4271,4228,4695,4798,4959,4659,4641,5200,5480,4980,5464,5280,4666,4398,4973,5752]},"gdp":{"KOR":[1038,1077,1088,1153,1229,1286,1405,1498,1657,1856,2001,2171,2287,2583,2784,2955,3294,3645,3987,4270,4140,4378,4676,5228,5713,6106,6741,7535,8367,8878,9673,10619,11177,11837,12817,13924,14894,15682,14801,16403,17763,18460,19775,20278,21245,22124,23162,24392,24935,25010,26623,27393,27944,28733,29471,30172,31005,31980,32853,33496,33216,34793,35809,36348,37048],"MEX":[4146,4219,4276,4475,4846,5021,5154,5278,5589,5596,5775,5809,6099,6385,6559,6741,6845,6889,7310,7815,8290,8875,8677,8099,8208,8194,7714,7716,7658,7784,8037,8197,8330,8412,8623,7971,8321,8771,9162,9265,9582,9398,9242,9222,9421,9492,9814,9878,9826,9074,9389,9576,9783,9739,9862,10021,10101,10194,10297,10159,9235,9728,10013,10235,10284]}};
const C={kor:'#1f6fd1',mex:'#c8541f',gtm:'#6a3fc1',ctx:'#bdb7ad',ink:'#1c1a17',ink2:'#4a4640',n1:'#2f2c28',n2:'#8f897f',n3:'#d6d1c7',mute:'#8a857c',line:'#dcd8d0',faint:'#bdb7ad'};
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- Helpers ----------
const num=(to,{dec=0,pre='',suf='',t=400,from=0,dur=1000}={})=>`<span data-to="${to}" data-from="${from}" data-dur="${dur}" data-dec="${dec}" data-pre="${pre}" data-suf="${suf}" data-t="${t}">${pre}${fmt(to,dec)}${suf}</span>`;
const R=(t,style,html,cls='r')=>`<div class="A ${cls}" style="--t:${t}ms;${style}">${html}</div>`;
function dots(n,{x=0,y=0,cols=1e9,p=28,r=11,color=C.ink,t0=300,st=20,hollow=false,tip=''}={}){
  let s='';for(let i=0;i<n;i++){const cx=x+(i%cols)*p+r,cy=y+Math.floor(i/cols)*p;
    s+=`<circle class="ap" style="--t:${t0+i*st}ms"${tip?` data-tip="${tip}"`:''} cx="${cx}" cy="${cy}" r="${hollow?r-1:r}" ${hollow?`fill="none" stroke="${color}" stroke-width="1.8"`:`fill="${color}"`}/>`}return s}
const kick=(t)=>R(0,'left:72px;top:62px',`<div class="cap">${t}</div>`);
const road=k=>`<div class="road">${['Past','Present','Future'].map((w,i)=>i===k?`<b>${w}</b>`:`<span>${w}</span>`).join('')}</div>`;
const marker=id=>`<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="${C.n2}"/></marker>`;

const S=[];
// ================= SPEAKER 1 · HOOK (slides 1-4) =================
S.push({who:'Speaker 1',noFoot:1,html:`
${R(0,'left:72px;top:62px',`<div class="cap">Ernst &amp; Young (EY) for the Inter-American Development Bank · Subregion: Mexico and Central America</div>`)}
<div class="rule" style="left:72px;right:72px;top:100px"></div>
${R(200,'left:66px;top:140px',`<div class="h" style="font-size:150px;font-weight:900;line-height:.9;letter-spacing:-.05em">Eight<br>patents</div>`)}
${R(500,'left:72px;top:470px;width:820px',`<div class="sub" style="font-size:26px">Why growth in Mexico and Central America has been so disappointing, and a plan for inclusive growth that lasts</div>`)}
<div class="rule" style="left:72px;right:72px;top:650px"></div>
${R(700,'left:72px;top:672px',`<div class="cap" style="text-transform:none;letter-spacing:.05em">Group 1 · Ernst &amp; Young (EY) · IE University · Economics for Public Sector · 12 November 2026</div>`)}`,
notes:`<b>Leave this up while the room settles.</b> Do not say "good morning" yet. Your first words are the hook on the next slide; introductions come on slide 4.`});

S.push({who:'Speaker 1',src:'Patent applications by residents, Guatemala, 2024 · World Bank WDI, IP.PAT.RESD · population SP.POP.TOTL',html:`
${kick('Guatemala · 2024')}
${R(200,'left:72px;top:120px;width:1190px',`<div class="h" style="font-size:72px">A whole country. One year.<br>Eight new ideas.</div>`)}
<svg class="A" style="left:72px;top:430px" width="1190" height="100">${dots(8,{x:0,y:40,p:150,r:44,color:C.gtm,t0:1200,st:350,tip:'One patent application · Guatemala, 2024'})}</svg>
${R(4200,'left:72px;top:560px',`<div class="cap">1 dot = 1 patent application · 18.4 million people</div>`)}`,
notes:`<b>Click, then wait for all eight dots before you speak.</b> About 45 seconds on this slide.<br>
"Last year, the whole of Guatemala filed <b>eight</b> patents. Eight. For 18 million people."<br>
If needed: a patent is a new invention someone registers so they can use it. It is the simplest count of new ideas a country produces.`});

S.push({who:'Speaker 1',src:'Patent applications by residents, 2024 · World Bank WDI, IP.PAT.RESD',html:`
${kick('South Korea · the same year')}
${R(300,'left:66px;top:150px',`<div class="big" style="font-size:250px;color:${C.kor}">${num(195786,{t:300,dur:1600})}</div>`)}
${R(1900,'left:72px;top:430px;width:1100px',`<div class="h" style="font-size:44px">new ideas, in one year. Korea has fewer people than Mexico.</div>`)}
${R(2400,'left:72px;top:540px',`<div class="sub">Guatemala: <b style="color:${C.gtm}">8</b></div>`)}`,
notes:`About 30 seconds.<br>
"The same year, South Korea filed <b>195,786</b>." <b>Pause two seconds.</b> Let the number land.<br>
"And Korea has fewer people than Mexico." (Korea about 52 million, Mexico about 130 million.)`});

S.push({who:'Speaker 1',src:'Executive summary · every figure is sourced on its own slide',html:`
${kick('Executive summary · the IDB asked: why has growth been so disappointing?')}
${R(200,'left:72px;top:110px;width:1190px',`<div class="h" style="font-size:96px">Know-how is bought,<br>not born.</div>`)}
<div class="rule" style="left:72px;right:72px;top:380px"></div>
${[['Past','Mexico and Korea started level.'],['Present','Korea paid to learn. The region did not.'],['Future','The IDB can start the homework this year.']].map(([a,b],i)=>
 R(900+i*350,`left:${72+i*400}px;top:410px;width:370px`,`<div class="cap" style="color:${C.ink}">${a}</div><div style="font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:12px">${b}</div>`)).join('')}`,
notes:`About 2 minutes. This is the executive summary.<br>
1. Introduce the group: "We are Group 1 from EY. The IDB commissioned us to answer one question: <b>why has growth in Mexico and Central America been so disappointing?</b>"<br>
2. <b>"If you remember one thing today: know-how is bought, not born."</b> (Message #1)<br>
3. Map, one line each: the past (they started level), the present (Korea paid to learn), the future (what the IDB can do).<br>
4. Why the IDB should care: "You get a practical plan for inclusive growth that lasts. You can fund it this year and check its scores every year."<br>
Hand over: "<b>[Speaker 2]</b> takes us back to 1980."`});

// ================= SPEAKER 2 · PAST + PRESENT (slides 5-9) =================
S.push({who:'Speaker 2',src:'Patent applications by residents, 1980 · World Bank WDI, IP.PAT.RESD',html:`
${kick('1980')}${road(0)}
${R(200,'left:72px;top:120px;width:520px',`<div class="h" style="font-size:64px">In 1980, Mexico and Korea were neck and neck.</div>`)}
${R(900,'left:72px;top:440px;width:480px',`<div class="sub">Two kids, same classroom, similar grades.</div>`)}
<svg class="A" style="left:660px;top:150px" width="600" height="420">
${dots(35,{x:0,y:200,cols:7,p:30,r:12,color:C.mex,t0:600,st:22,tip:'Mexico · 704 patents in 1980'})}

<text class="ap" style="--t:2900ms" x="300" y="370" font-size="20" font-weight="700" letter-spacing=".05em" fill="${C.kor}">KOREA <tspan fill="${C.ink}">1,241</tspan></text>
<text class="ap" style="--t:3100ms" x="0" y="408" font-size="14" fill="${C.mute}" letter-spacing=".12em">1 DOT = 20 PATENTS · SAME SCALE FOR BOTH</text></svg>`,
notes:`About 45 seconds.<br>
"Go back to 1980. Mexico filed 704 patents, Korea 1,241. Close. Two kids, same classroom, similar grades."<br>
Point out: same scale for both, so you can compare them by eye.`});

const ZS={ox:52,oy:24,w:580,h:270,y0:1980,series:[{k:'BRA',v:D.pat.BRA,c:C.ctx,name:'BRAZIL',end:'5,752',dy:-8},

const LC={zc:{series:ZS.series,x0:1980,x1:2024,w:ZS.w,h:ZS.h,ymax:200000,ox:ZS.ox,oy:ZS.oy,vfmt:v=>fmt(v)}};
S.push({who:'Speaker 2',zoom:1,src:'Patent applications by residents, 1980 to 2024 · World Bank WDI, IP.PAT.RESD · Brazil in grey for context',html:`
${road(1)}
<div class="card">${R(0,'position:relative',`<div class="cap">1980 to 2024</div>`)}
 ${R(150,'position:relative;margin-top:14px',`<div class="h" style="font-size:52px">Then Korea did its homework.</div>`)}
 ${R(2900,'position:relative;margin-top:44px',`<div class="big" style="font-size:110px;color:${C.kor}">${num(158,{pre:'×',t:2900,from:1,dur:2400})}</div>`)}
 ${R(3200,'position:relative;margin-top:14px',`<div class="sub" style="font-size:19px">Korea’s patents, 1980 to 2024.<br>Mexico’s: ×1.7</div>`)}</div>
<div class="A" style="left:520px;top:120px"><svg id="zc" width="760" height="360">
 <defs><clipPath id="zclip"><rect x="40" y="0" width="610" height="296"/></clipPath></defs>
 <g id="zgrid"></g>

   `<text x="${zFX+12}" y="${ly+se.dy-3}" font-size="16" font-weight="700" letter-spacing=".04em" fill="${se.c}">${se.name}</text>
    <text x="${zFX+12}" y="${ly+se.dy+15}" font-size="15" font-weight="600" fill="${se.hi?C.ink:C.mute}">${se.end}</text>`}).join('')}</g>

S.push({who:'Speaker 2',src:'Research and development spending, % of GDP · World Bank WDI, GB.XPD.RSDV.GD.ZS · latest year, 2022 to 2024',html:`
${kick('What was the homework?')}${road(1)}

S.push({who:'Speaker 2',src:'Researchers in R&D per million people · World Bank WDI, SP.POP.SCIE.RD.P6 · Korea 2023, Mexico 2024',html:`
${road(1)}
<div class="card">${R(0,'position:relative',`<div class="cap">Who does the homework</div>`)}

<div style="font-size:16px;line-height:1.5;margin-top:8px">We acknowledge the use of Claude (Anthropic, https://claude.ai) to locate sources, retrieve and recheck the World Bank series with code, and draft and design these slides. The prompts included asking for story angles, simplifying the story so a 12-year-old could follow it, applying our Data Fluency and Storytelling course rules, and verifying every figure and marking anything it could not. The outputs were a basis we revised; the diagnosis, the recommendation and the delivery are ours.</div>`)}`,
notes:`Use this only in Q&A. Likely questions:<br>
• "Korea had US support and a military government." Agree. One country is not a perfect model. That's why the plan copies regional cases (Chile, Costa Rica, Medellín).<br>
• "Firms file patents abroad." True. Patents are the simplest comparable count, not the whole picture.<br>
• "What does it cost?" Costing is still open and gets built with IDB project data. Say so plainly.<br>
• "Which country first?" Pick one as a group before Thursday.`});

// ---------- Render ----------
const stage=document.getElementById('stage');const N=S.length;
stage.innerHTML=S.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}${s.noFoot?'':`<div class="foot">${s.src}</div>`}</section>`).join('')+`<div id="tip"></div>`;
const els=[...stage.querySelectorAll('.slide')];let cur=0,scale=1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

let raf=[];
function countUp(sl){raf.forEach(cancelAnimationFrame);raf=[];
  sl.querySelectorAll('[data-to]').forEach(el=>{const to=+el.dataset.to,from=+el.dataset.from||0,dec=+el.dataset.dec,pre=el.dataset.pre,suf=el.dataset.suf,delay=+el.dataset.t,dur=+el.dataset.dur||1000;
    const final=pre+fmt(to,dec)+suf;if(RM){el.textContent=final;return}
    el.textContent=pre+fmt(from,dec)+suf;const t0=performance.now()+delay;
    const step=now=>{const k=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-k,3);el.textContent=pre+fmt(from+(to-from)*e,dec)+suf;
      if(k<1)raf.push(requestAnimationFrame(step));else el.textContent=final};raf.push(requestAnimationFrame(step))})}

// ---------- Slide 6 zoom ----------
let zRaf=0;
function zRender(svg,{xmax,ymax,tEnd,b0}){
  const {ox,oy,w,h,y0}=ZS,X=y=>ox+(y-y0)/(xmax-y0)*w,Y=v=>oy+h-v/ymax*h,q=s=>svg.querySelector(s);
  const minorA=Math.max(0,Math.min(1,(30000-ymax)/20000));
  q('#zgrid').innerHTML=[1000,2000,3000,4000,50000,100000,150000,200000].filter(v=>v<=ymax*1.001).map(v=>{const a=v<50000?minorA:1;
    return a<=0?'':`<g opacity="${a}"><line x1="${ox}" x2="${ox+w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.line}"/><text x="${ox-8}" y="${Y(v)+4}" text-anchor="end" font-size="13" fill="${C.mute}">${v/1000}k</text></g>`}).join('');
  q('#zx1').textContent=Math.round(xmax);
  const pts=se=>{const n=Math.floor(tEnd-y0+1e-9),f=tEnd-y0-n,a=[];for(let i=0;i<=n;i++)a.push([X(y0+i),Y(se.v[i])]);
    if(f>1e-6&&n+1<se.v.length)a.push([X(y0+n+f),Y(se.v[n]+(se.v[n+1]-se.v[n])*f)]);return a};
  ZS.series.forEach(se=>q('#zp'+se.k).setAttribute('points',pts(se).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')));
  const kp=pts(ZS.series[2]);q('#za').setAttribute('points',`${X(y0)},${Y(0)} ${kp.map(p=>p.join(',')).join(' ')} ${kp[kp.length-1][0]},${Y(0)}`);
  q('#za').style.opacity=Math.max(0,Math.min(1,(xmax-1990)/34));
  const bx=X(y0)+12,yK=Y(D.pat.KOR[0]),yM=Y(D.pat.MEX[0]),L=q('#zb0').querySelectorAll('line'),T=q('#zb0').querySelector('text');
  L[0].setAttribute('x1',bx);L[0].setAttribute('x2',bx);L[0].setAttribute('y1',yK);L[0].setAttribute('y2',yM);
  [[1,yK],[2,yM]].forEach(([k,y])=>{L[k].setAttribute('x1',bx-6);L[k].setAttribute('x2',bx);L[k].setAttribute('y1',y);L[k].setAttribute('y2',y)});
  T.setAttribute('x',bx+12);T.setAttribute('y',(yK+yM)/2+8);q('#zb0').style.opacity=b0;
}
function zFinal(svg){zRender(svg,{xmax:2024,ymax:200000,tEnd:2024,b0:0});svg.querySelector('#zlab').style.opacity=1;svg.querySelector('#zhov').style.pointerEvents='auto'}
function zoomAnim(sl){cancelAnimationFrame(zRaf);const svg=sl.querySelector('#zc');svg.querySelector('#zlab').style.opacity=0;svg.querySelector('#zhov').style.pointerEvents='none';
  if(RM){zFinal(svg);return}
  const t0=performance.now(),io=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,out=k=>1-Math.pow(1-k,3),cl=k=>Math.max(0,Math.min(1,k));
  const step=now=>{const t=now-t0;let st;
    if(t<2100){const k=out(cl((t-400)/1700));st={xmax:1990,ymax:4000,tEnd:1980+5*k,b0:cl((t-500)/400)}}
    else if(t<2900)st={xmax:1990,ymax:4000,tEnd:1985,b0:1};
    else{const k=io(cl((t-2900)/2400));st={xmax:1990+34*k,ymax:4000+196000*(1-Math.pow(1-k,2)),tEnd:1985+39*k,b0:1-cl(k*3)}}
    zRender(svg,st);if(t<5300)zRaf=requestAnimationFrame(step);else zFinal(svg)};
  zRaf=requestAnimationFrame(step)}
addEventListener('beforeprint',()=>document.querySelectorAll('#zc').forEach(zFinal));

// ---------- Navigation, notes, tooltips ----------
const notes=document.getElementById('notes');
function go(n){cur=Math.max(0,Math.min(N-1,n));els.forEach((e,i)=>e.classList.toggle('on',i===cur));
  countUp(els[cur]);hideTip();if(S[cur].zoom)zoomAnim(els[cur]);else cancelAnimationFrame(zRaf);
  notes.innerHTML=`<div class="who">${S[cur].who} · slide ${cur+1} of ${N}</div>${S[cur].notes||''}`;
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function fit(){scale=Math.min(innerWidth/1334,innerHeight/750);stage.style.transform=`scale(${scale})`}
addEventListener('resize',fit);fit();
const toggleNotes=()=>notes.classList.toggle('show');
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==='Home')go(0);if(e.key==='End')go(N-1);
 if(e.key==='n'||e.key==='N')toggleNotes()});
document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('nt').onclick=toggleNotes;
const tip=document.getElementById('tip');
function showTip(html,cx,cy){const r=stage.getBoundingClientRect();tip.innerHTML=html;let x=(cx-r.left)/scale+14,y=(cy-r.top)/scale-48;
  tip.classList.add('show');const w=tip.offsetWidth;if(x+w>1320)x-=w+28;tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px'}
function hideTip(){tip.classList.remove('show');stage.querySelectorAll('.xh').forEach(g=>g.style.opacity=0)}
stage.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');
  if(t){const[a,...b]=t.dataset.tip.split(' · ');showTip(`<b>${a}</b>${b.join(' · ')}`,e.clientX,e.clientY);return}
  if(e.target.matches('rect[data-lc]')){const o=LC[e.target.dataset.lc],svg=e.target.ownerSVGElement,p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse()),i=Math.max(0,Math.min(o.x1-o.x0,Math.round((q.x-o.ox)/o.w*(o.x1-o.x0)))),X=o.ox+i/(o.x1-o.x0)*o.w;
    const g=svg.querySelector('.xh');g.style.opacity=1;g.querySelector('line').setAttribute('x1',X);g.querySelector('line').setAttribute('x2',X);
    g.querySelectorAll('circle').forEach(c=>{const se=o.series[+c.dataset.k];c.setAttribute('cx',X);c.setAttribute('cy',o.oy+o.h-se.v[i]/o.ymax*o.h)});
    showTip(`<b>${o.x0+i}</b>Korea ${o.vfmt(o.series[2].v[i])}<br>Mexico ${o.vfmt(o.series[1].v[i])}`,e.clientX,e.clientY);return}
  hideTip()});
stage.addEventListener('mouseleave',hideTip);
stage.addEventListener('click',e=>{if(e.target.closest('[data-tip],rect[data-lc]'))return;go(cur+(e.clientX<innerWidth*.25?-1:1))});
document.querySelectorAll('#zc').forEach(zFinal);
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
