<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Patents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Design after the CareerIQ reference: white page, one centred point per slide, one visual, one caption. */
:root{--ink:#111;--paper:#fff;--surround:#e6e6e6;--muted:#5c5c5c;--line:#e3e3e3;--grey:#bdbdbd;
  --kor:#2f5bff;--mex:#e8590c;--gtm:#7b3fe4;--out:cubic-bezier(.2,.75,.2,1);--spring:cubic-bezier(.3,1.6,.5,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surround);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);overflow:hidden}
section.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
section.slide.on{opacity:1;visibility:visible;transition:opacity .45s ease}
.A{position:absolute}
h1.cover{position:absolute;left:160px;right:160px;top:330px;text-align:center;font-size:170px;font-weight:900;letter-spacing:-7px;line-height:.95}
p.cover-sub{position:absolute;left:180px;right:180px;top:610px;text-align:center;font-size:32px;line-height:1.35;color:var(--muted)}
p.by{position:absolute;left:160px;right:160px;bottom:64px;text-align:center;font-size:24px;color:var(--muted);line-height:1.5}
h2.t{position:absolute;left:160px;right:160px;top:104px;text-align:center;font-size:64px;font-weight:800;line-height:1.08;letter-spacing:-2px;text-wrap:balance}
.lockup{position:absolute;left:0;right:0;top:120px;display:flex;align-items:center;justify-content:center;gap:36px}
.logo{display:flex;align-items:center;justify-content:center;height:96px}
.logo img{height:96px;width:auto;display:block}
.logo .txt{font-size:72px;font-weight:900;letter-spacing:-2px}
.lockup .x{font-size:56px;color:var(--muted);font-weight:400}
.mark{position:absolute;right:40px;bottom:46px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--muted);z-index:6}
.mark img{height:28px;width:auto}
.s2,.s3,.s4{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .7s var(--out)}
.slide.st1 .s2,.slide.st2 .s3,.slide.st3 .s4{opacity:1;transform:none;transition-delay:var(--sd,0s)}
.s1{transition:opacity .4s ease}.slide.st1 .s1{opacity:0}
.slide.st2 .x2{opacity:0!important;transition-delay:0s!important}
.secbar{position:absolute;left:0;right:0;top:16px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:19px;font-weight:600;color:#b5b5b5;z-index:6}
.secbar b{color:#fff;background:var(--ink);font-weight:900;padding:5px 14px;border-radius:999px;letter-spacing:.02em}
.spk{position:absolute;left:40px;bottom:46px;font-size:18px;font-weight:700;color:var(--muted);z-index:6}
.tag{position:absolute;left:160px;right:160px;top:68px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
p.cap{position:absolute;left:160px;right:160px;bottom:50px;text-align:center;font-size:24px;color:var(--muted);text-wrap:balance}
h2.big{position:absolute;left:200px;right:200px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:112px;font-weight:900;line-height:1.04;letter-spacing:-4px;text-wrap:balance}
h2.big small{display:block;font-size:42px;font-weight:500;letter-spacing:-.5px;line-height:1.3;margin-top:36px;color:var(--muted);max-width:1300px}
p.foot{position:absolute;left:200px;right:200px;bottom:130px;text-align:center;font-size:40px;font-weight:800;letter-spacing:-1px;text-wrap:balance}
.cols3{position:absolute;left:180px;right:180px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:80px;text-align:center}
.cols3 h3{font-size:30px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding-bottom:14px;border-bottom:4px solid var(--ink);margin-bottom:18px}
.cols3 p{font-size:36px;font-weight:700;line-height:1.25;letter-spacing:-1px}
.cols3 p.s{font-size:26px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.lab{position:absolute;font-size:30px;font-weight:800;letter-spacing:.02em;text-align:center}
.lab span{color:var(--ink)}
.pk{color:var(--mex)}.bl{color:var(--kor)}.pu{color:var(--gtm)}
svg{overflow:visible}
svg text{font-family:Inter,sans-serif}
#dots{position:absolute;inset:0;width:1920px;height:1080px;z-index:5;pointer-events:none}
#dots circle{transition:transform .9s cubic-bezier(.65,0,.25,1),opacity .5s ease,fill .6s ease;pointer-events:auto}
#progress{position:fixed;left:0;bottom:0;height:4px;width:0;background:var(--ink);z-index:20;transition:width .4s ease}
#nav{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:21;opacity:.3;transition:opacity .2s}#nav:hover{opacity:1}
#nav button{font:700 13px Inter,sans-serif;border:0;background:#111;color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;transition:transform .18s var(--spring)}
#nav button:active{transform:scale(.88);transition-duration:.06s}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:rgba(17,17,17,.95);color:#f2f2f2;z-index:22;
  padding:18px 28px 22px;font:16px/1.5 Inter,sans-serif;transform:translateY(105%);transition:transform .35s var(--out)}
#notes.show{transform:none}
#notes .who{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ff9f6b;margin-bottom:6px}
#notes b{color:#fff}
#tip{position:absolute;z-index:30;pointer-events:none;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:12px 14px;font:18px/1.35 Inter,sans-serif;
  box-shadow:0 8px 24px rgba(0,0,0,.12);opacity:0;transition:opacity .15s;white-space:nowrap}
#tip.show{opacity:1}
#tip b{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:2px}

/* build-in: text rises, marks appear; the dots move on their own layer */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ap{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-origin:left center;transform-box:fill-box}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.on .b{animation:rise .7s var(--out) both;animation-delay:var(--t,calc(var(--i,0)*90ms + 80ms))}
.slide.on .ap{animation:ap .45s ease both;animation-delay:var(--t,0ms)}
.slide.on .draw{animation:draw var(--dur,1.2s) cubic-bezier(.45,0,.2,1) both;animation-delay:var(--t,0ms)}
.slide.on .grow{animation:grow var(--dur,1s) var(--out) both;animation-delay:var(--t,0ms)}
@media (prefers-reduced-motion:reduce){.slide *{animation:none!important}.draw{stroke-dashoffset:0}#dots circle{transition:none}}
</style>
</head>

`<b>Speaker 1 · about 30 seconds.</b> Open with the hook, out loud, before any introduction: "Last year, a whole country filed eight patents." Then click.`,
`<b>Speaker 1 · Executive summary · about 1 minute 30.</b><br>"We are Group 1 from <b>Ernst &amp; Young</b>. We were commissioned by the <b>Inter-American Development Bank</b>, the IDB, the development bank that lends to governments across Latin America and the Caribbean. The IDB asked us one question: <b>why has growth in Mexico and Central America been so disappointing?</b>" (Full names once; "EY" and "the IDB" after this.)<br><b>Three clicks:</b> the problem is on screen. Click: the cause. Click: the fix. Click: the ask.<br>"The problem: eight patents, a whole country, one year. The cause: <b>know-how can be bought, and the region has invested too little in it.</b> (Message #1) The fix: <b>bring in the builders</b>: foreign firms that open permanent plants and labs in second cities and train local firms and workers. Our ask: fund it in one country, this year."`,
`<b>Speaker 1 · Regional context · about 1 minute. Two clicks.</b><br>Wait for all eight dots. "Last year, the whole of Guatemala filed <b>eight</b> patents. Eight. For 18 million people."<br><b>Click:</b> the eight shrink into a speck as Korea's dots fill the slide. "The same year, South Korea filed <b>195,786</b>. And Korea has fewer people than Mexico."`,
`<b>Speaker 1 · about 1 minute.</b> The dots spread into 123 countries.<br>"Does this matter? Across 123 countries, the ones that invent more are richer. Ten times more patents per person goes with about <b>2.7 times</b> the income. Korea is top right. Our subregion is bottom left."<br>Be honest if asked: "This is correlation, not proof. Patents are the thermometer. The engine is know-how, and growth economics links know-how to growth: Romer, and Hausmann and Hidalgo on economic complexity."`,
`<b>Speaker 1 · about 45 seconds.</b><br>"This is what disappointing growth looks like. In 1960 Mexico was <b>four times richer</b> than Korea. Around 1988 they swapped. Today Korea is <b>3.6 times richer</b>."<br><b>Hand-off:</b> "So why? <b>[Speaker 2]</b> has the diagnosis."`,
`<b>Speaker 2 · Diagnostic · about 45 seconds.</b><br>"Four causes. First: the region barely pays for research. Korea spends almost <b>5%</b> of its economy on research every year; the OECD average is about 3%; Latin America, under 0.7%. Most of South America and the Caribbean is low too, and our subregion is at the bottom: Mexico <b>0.25%</b>, Guatemala almost <b>zero</b>. That is a policy choice, written into a budget."`,
`<b>Speaker 2 · about 45 seconds.</b><br>"Second: few people are paid to invent. Korea has about 9,500 researchers per million people. Chile has about 700. <b>Every country in our subregion is below Chile</b>: Mexico 438, Guatemala 1.4." If time: "That is about 26 researchers in the whole of Guatemala."`,
`<b>Speaker 2 · about 1 minute 15.</b><br>"Third: the capital races ahead and the rest of the country is left behind. Jobs, universities and investment pile up in the capital, and young people and money leave the regions. Economists call it backwash."<br>"Look at the gap. In Korea, the capital region is only <b>1.3 times</b> richer than the poorest region. In Costa Rica, 2.5 times. In Mexico, Mexico City is <b>5.9 times</b> richer than Chiapas."<br>If asked: "Mexico's richest region is actually Campeche, because of oil, so we compare the capital." OECD Regional Database, 2021.`,
`<b>Speaker 2 · about 1 minute.</b><br>"Fourth: hiring someone officially costs extra, because payroll taxes pay for health and pensions. So firms stay small and off the books. Across our subregion, about <b>6 in 10 workers</b> are informal, against about 1 in 4 in Chile. Honduras and Guatemala are the worst; Costa Rica the best." (ILOSTAT, 2025; Santiago Levy's argument.)`,
`<b>Speaker 2 · the climax · about 45 seconds. Slow down.</b><br>"Four causes, one pattern. <b>Know-how can be bought, and the region has invested too little in it.</b>" (Message #2)<br><b>Hand-off:</b> "Is this destiny? No. <b>[Speaker 3]</b> shows who has done it."`,
`<b>Speaker 3 · International benchmarks · about 45 seconds.</b><br>"Were we always behind? No. In 1980 Mexico filed 704 patents and Korea 1,241. Two kids, same classroom, similar grades."`,

`<b>Speaker 3 · about 1 minute.</b><br>"And it has been done next door. Costa Rica went after foreign factories on purpose, through its agency CINDE. <b>FDI brings technology and know-how</b>, and local firms and workers learn from it." (Message #3: know-how can be bought.) ⚠ Check the CINDE details.<br><b>Hand-off:</b> "So what should the IDB do? <b>[Speaker 4]</b>."`,
`<b>Speaker 4 · Policy recommendations · about 45 seconds.</b><br>"So what should the IDB do? Not chase patents. Patents are the thermometer, not the medicine. The medicine is know-how, and the fastest way to get it is to <b>bring in the builders</b>: foreign firms that open permanent plants and labs here, not consultants, and train local firms and workers. Three moves, one for each cause."`,

`<b>Speaker 4 · about 1 minute.</b> Fixes cause 4.<br>"Three: make formal hiring cheaper. Pay for health and pensions from general taxes, not wages. Then local firms can come onto the books and become suppliers to the foreign firms." Say the cost first: "It costs money before it saves money."<br><b>Hand-off:</b> "<b>[Speaker 5]</b> on how we roll it out."`,
`<b>Speaker 5 · about 1 minute 15.</b><br>"Governments last four years; these programmes don't. So the cheapest, fastest step goes first, and each step has to earn the next. Every year we publish three scores. We are not promising a growth number." If asked: inclusive, because it reaches towns and informal workers; sustainable, because know-how lasts.`,

{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 1 of 8: The evidence')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Do more patents cause growth?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Not on their own. Patents are the thermometer; know-how is the engine.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Across 123 countries, inventing goes strongly with income (correlation 0.75), but only weakly with later growth (+0.4 points a year per 10× patents, holding starting income).</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: World Bank WDI · Romer 1990 · Hidalgo & Hausmann 2009</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Why measure growth from 2000, and why is Panama missing?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">To compare like with like.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Honduras’ 1990s data has a break that fakes very fast growth. Panama grew on the canal, logistics and finance, a case the rest cannot copy. Panama is in every other chart.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: World Bank WDI, NY.GDP.PCAP.KD</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 2 of 8: Korea and the comparison')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Is Korea a fair comparison?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Partly. That is why the plan copies cases from this region.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Korea had US support and, for decades, an authoritarian state. We use Korea to show the gap is not destiny, and Costa Rica and Chile to show what works here.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Our benchmarks: CINDE (Costa Rica), Fundación Chile</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Patents miss a lot. Firms file abroad.</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">True. Patents are the simplest count we can compare.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Research spending and researchers per person point the same way, and both are under our control.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: World Bank WDI: GB.XPD.RSDV.GD.ZS, SP.POP.SCIE.RD.P6</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 3 of 8: The plan')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Won’t foreign firms just take the profits out?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Some profit leaves. The know-how stays.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">That is why the deal has conditions: train local suppliers, hire formally, partner with a local university. The plant and the skills stay in the country.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Precedent: CINDE in Costa Rica</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Why second cities, not the capital?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">The capital already soaks everything up.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Mexico City is 5.9× richer per person than Chiapas; in Korea the capital is only 1.3× its poorest region. Second cities spread the jobs.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: OECD Regional Database, 2021</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 4 of 8: Cost and first steps')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">What does it cost, and who pays?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Costing is our first 90-day step.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">We will build it with IDB project data rather than quote a number we cannot defend. Cheaper hiring costs money before it saves money, so it is phased in.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Next steps, slide 19</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Is informality really caused by payroll taxes?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">It is one main cause, not the only one.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Santiago Levy shows payroll taxes push firms to stay small and hidden. The size of the problem: about 6 in 10 workers across our subregion.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: ILOSTAT, SDG 8.3.1, 2025 · Levy</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 5 of 8: Critics of foreign investment')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Mexico already gets lots of foreign investment. Why hasn’t it worked?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Because most of it came without conditions.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Many assembly plants imported parts and exported finished goods, with few local suppliers and little training. Our plan attaches conditions: local suppliers, formal hiring, a university partner.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Linkage and spillover literature · verify any local-content figure before quoting</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Isn’t this a race to the bottom on tax breaks?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">No. The IDB funds a team and conditions, not tax holidays.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Firms come for location, workers and stability. Any incentive is time-limited and tied to training and buying locally.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Recommendation 1, slide 15</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 6 of 8: What the plan does not fix alone')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">What about insecurity and weak institutions?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">They matter, and this plan does not fix them alone.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">We pick the pilot country and second city partly on security and rule of law. Formal jobs and regional growth help, but policing is outside this mandate.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Pilot-country choice, next steps on slide 19</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Shouldn’t you fix schools first?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Schools matter, but skills need jobs that use them.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Training inside real plants and university partnerships builds skills that are used straight away. It adds to education reform; it does not replace it.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Causes 1 and 2, slides 6 and 7</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 7 of 8: Theory and measurement')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">In growth-diagnostics terms, what is the binding constraint?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Too little learning: firms under-invest in know-how they cannot keep for themselves.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">That is a market failure in learning (self-discovery, Hausmann and Rodrik). The four causes show it; the plan pays for the learning firms will not pay for alone.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Hausmann, Rodrik and Velasco (growth diagnostics) · Hausmann and Rodrik (self-discovery)</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">What if the scores don’t move?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Then the IDB changes course, in public.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Three scores are published every year. If after three years local suppliers and formal jobs have not risen, the programme is redesigned or stopped.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Implementation, slide 18</div></div></div>`},
{who:'Appendix',sec:-1,spk:0,notes:'Appendix: use only in Q&A. Repeat the question, give the short answer, then the reason. Hand back to Speaker 5.',html:`${TAG('Appendix · questions we expect · not part of the 20 slides')}${T('Q&amp;A 8 of 8: Our data choices')}<div class="A" style="left:180px;right:180px;top:250px;display:grid;grid-template-columns:1fr 1fr;gap:90px"><div class="b" style="--t:300ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Why isn’t the Dominican Republic on the growth chart?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">We show a selection, and it grew fast: 3.4% a year.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">Much of that growth is reported to come from tourism and free-trade zones with foreign firms, which supports our plan rather than contradicting it.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: World Bank WDI · verify the drivers before quoting</div></div><div class="b" style="--t:700ms;border-top:4px solid #111;padding-top:18px"><div style="font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15">Mexico and Central America are very different. Why one plan?</div><div style="font-size:28px;font-weight:800;color:${C.kor};margin-top:18px;line-height:1.25">Same pattern, different size.</div><div style="font-size:23px;line-height:1.45;color:#333;margin-top:14px">On every chart the subregion is at the bottom on research and researchers and high on informality. The plan pilots in one country and adapts.</div><div style="font-size:18px;color:${C.muted};margin-top:14px">Evidence: Slides 5 to 9</div></div></div>`}];
APPX.forEach(a=>S.push(a));

// ---------- Render ----------
const stage=document.getElementById('stage');const N=S.length;
const POOL=210;
stage.innerHTML=S.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}${s.cover?'':`<div class="mark"><img src="${LOGO_EY}" alt="" style="height:30px">for the IDB</div>`}${s.sec>=0?`<div class="secbar">${SECS.map((n,k)=>k===s.sec?`<b>${n}</b>`:`<span>${n}</span>`).join('')}</div>`:''}${s.spkName?`<div class="spk">${s.spkName}</div>`:''}</section>`).join('')+
 `<svg id="dots" viewBox="0 0 1920 1080">${Array.from({length:POOL},(_,i)=>`<circle r="10" cx="0" cy="0" style="opacity:0;transform:translate(960px,560px) scale(0)"/>`).join('')}</svg><div id="tip"></div>`;
const els=[...stage.querySelectorAll('section.slide')],dotEls=[...stage.querySelectorAll('#dots circle')];let cur=0,scale=1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const last=Array(POOL).fill(null);
function placeDots(name){const pts=name?L[name]():[];
  dotEls.forEach((el,i)=>{const p=pts[i];
    if(p){const fresh=!last[i];if(fresh&&!RM){el.style.transition='none';el.style.transform=`translate(${p.x}px,${p.y}px) scale(0)`;el.getBoundingClientRect();el.style.transition=''}
      el.style.transitionDelay=fresh?`${200+i*(name==='hook'?170:6)}ms`:`${i*2}ms`;
      el.style.transform=`translate(${p.x}px,${p.y}px) scale(${p.r/10})`;el.style.opacity=1;el.setAttribute('fill',p.c);el.dataset.tip=p.tip||'';last[i]=p}
    else{el.style.transitionDelay='0ms';el.style.opacity=0;if(last[i])el.style.transform=`translate(${last[i].x}px,${last[i].y}px) scale(0)`;el.dataset.tip='';last[i]=null}})}

let raf=[];
const lvl=el=>el.closest('.s4')?4:el.closest('.s3')?3:el.closest('.s2')?2:1;
function countUp(sl,level=1){raf.forEach(cancelAnimationFrame);raf=[];
  [...sl.querySelectorAll('[data-to]')].filter(el=>lvl(el)===level).forEach(el=>{const to=+el.dataset.to,from=+el.dataset.from||0,dec=+el.dataset.dec,pre=el.dataset.pre,suf=el.dataset.suf,delay=+el.dataset.t,dur=+el.dataset.dur||1000;
    const final=pre+fmt(to,dec)+suf;if(RM){el.textContent=final;return}
    el.textContent=pre+fmt(from,dec)+suf;const t0=performance.now()+delay;
    const step=now=>{const k=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-k,3);el.textContent=pre+fmt(from+(to-from)*e,dec)+suf;
      if(k<1)raf.push(requestAnimationFrame(step));else el.textContent=final};raf.push(requestAnimationFrame(step))})}

// ---------- the zoom chart ----------
let zRaf=0;
function zRender(svg,{xmax,ymax,tEnd,b0}){
  const {ox,oy,w,h,y0}=ZS,X=y=>ox+(y-y0)/(xmax-y0)*w,Y=v=>oy+h-v/ymax*h,q=s=>svg.querySelector(s);
  const minorA=Math.max(0,Math.min(1,(30000-ymax)/20000));
  q('#zgrid').innerHTML=[1000,2000,3000,4000,50000,100000,150000,200000].filter(v=>v<=ymax*1.001).map(v=>{const a=v<50000?minorA:1;
    return a<=0?'':`<g opacity="${a}"><line x1="${ox}" x2="${ox+w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.line}"/><text x="${ox-14}" y="${Y(v)+7}" text-anchor="end" font-size="20" fill="${C.muted}">${v/1000}k</text></g>`}).join('');
  q('#zx1').textContent=Math.round(xmax);
  const pts=se=>{const n=Math.floor(tEnd-y0+1e-9),f=tEnd-y0-n,a=[];for(let i=0;i<=n;i++)a.push([X(y0+i),Y(se.v[i])]);
    if(f>1e-6&&n+1<se.v.length)a.push([X(y0+n+f),Y(se.v[n]+(se.v[n+1]-se.v[n])*f)]);return a};
  ZS.series.forEach(se=>q('#zp'+se.k).setAttribute('points',pts(se).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')));
  const kp=pts(ZS.series[2]);q('#za').setAttribute('points',`${X(y0)},${Y(0)} ${kp.map(p=>p.join(',')).join(' ')} ${kp[kp.length-1][0]},${Y(0)}`);
  q('#za').style.opacity=Math.max(0,Math.min(1,(xmax-1990)/34));
  const bx=X(y0)+16,yK=Y(D.pat.KOR[0]),yM=Y(D.pat.MEX[0]),Ls=q('#zb0').querySelectorAll('line'),Tx=q('#zb0').querySelector('text');
  Ls[0].setAttribute('x1',bx);Ls[0].setAttribute('x2',bx);Ls[0].setAttribute('y1',yK);Ls[0].setAttribute('y2',yM);
  [[1,yK],[2,yM]].forEach(([k,y])=>{Ls[k].setAttribute('x1',bx-8);Ls[k].setAttribute('x2',bx);Ls[k].setAttribute('y1',y);Ls[k].setAttribute('y2',y)});
  Tx.setAttribute('x',bx+16);Tx.setAttribute('y',(yK+yM)/2+12);q('#zb0').style.opacity=b0;
}
function zFinal(svg){zRender(svg,{xmax:2024,ymax:200000,tEnd:2024,b0:0});svg.querySelector('#zlab').style.opacity=1;svg.querySelector('#zhov').style.pointerEvents='auto'}
function zoomAnim(sl,phase){cancelAnimationFrame(zRaf);const svg=sl.querySelector('#zc');
  const io=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,out=k=>1-Math.pow(1-k,3),cl=k=>Math.max(0,Math.min(1,k));
  if(phase===1){svg.querySelector('#zlab').style.opacity=0;svg.querySelector('#zhov').style.pointerEvents='none';
    if(RM){zRender(svg,{xmax:1990,ymax:4000,tEnd:1985,b0:1});return}
    const t0=performance.now();const step=now=>{const t=now-t0,k=out(cl((t-400)/1700));
      zRender(svg,{xmax:1990,ymax:4000,tEnd:1980+5*k,b0:cl((t-500)/400)});if(t<2200)zRaf=requestAnimationFrame(step)};
    zRaf=requestAnimationFrame(step);return}
  if(RM){zFinal(svg);return}
  const t0=performance.now();const step=now=>{const t=now-t0,k=io(cl(t/2400));
    zRender(svg,{xmax:1990+34*k,ymax:4000+196000*(1-Math.pow(1-k,2)),tEnd:1985+39*k,b0:1-cl(k*3)});
    if(t<2500)zRaf=requestAnimationFrame(step);else zFinal(svg)};
  zRaf=requestAnimationFrame(step)}

// ---------- navigation, notes, tooltips ----------
const notes=document.getElementById('notes'),prog=document.getElementById('progress');
function go(n){cur=Math.max(0,Math.min(N-1,n));els.forEach((e,i)=>e.classList.toggle('on',i===cur));
  els.forEach(e=>e.classList.remove('st1','st2','st3'));stepIdx=0;
  placeDots(S[cur].dotsSteps?S[cur].dotsSteps[0]:S[cur].dots);countUp(els[cur]);hideTip();if(S[cur].zoom)zoomAnim(els[cur],1);else cancelAnimationFrame(zRaf);if(S[cur].zoomI)ziAnim(els[cur],1);else cancelAnimationFrame(ziRaf);
  notes.innerHTML=`<div class="who">${S[cur].who} · slide ${cur+1} of ${N}</div>${S[cur].notes||''}`;prog.style.width=((cur+1)/N*100)+'%';
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
let stepIdx=0;
function next(){const n=S[cur].steps||0;if(stepIdx<n){stepIdx++;els[cur].classList.add('st'+stepIdx);hideTip();if(S[cur].zoom&&stepIdx===1)zoomAnim(els[cur],2);if(S[cur].zoomI)ziAnim(els[cur],stepIdx+1);if(S[cur].dotsSteps)placeDots(S[cur].dotsSteps[stepIdx]);countUp(els[cur],stepIdx+1);return}go(cur+1)}
function fit(){scale=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*scale)/2}px,${(innerHeight-1080*scale)/2}px) scale(${scale})`}
addEventListener('resize',fit);fit();
const toggleNotes=()=>notes.classList.toggle('show');
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==='Home')go(0);if(e.key==='End')go(N-1);if(e.key==='n'||e.key==='N')toggleNotes()});
document.getElementById('nx').onclick=()=>next();document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('nt').onclick=toggleNotes;
const tip=document.getElementById('tip');
function showTip(html,cx,cy){const r=stage.getBoundingClientRect();tip.innerHTML=html;let x=(cx-r.left)/scale+18,y=(cy-r.top)/scale-70;
  tip.classList.add('show');const w=tip.offsetWidth;if(x+w>1900)x-=w+36;tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px'}
function hideTip(){tip.classList.remove('show');stage.querySelectorAll('.xh').forEach(g=>g.style.opacity=0)}
stage.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');
  if(t&&t.dataset.tip){const[a,b]=t.dataset.tip.split('|');showTip(`<b>${a}</b>${b||''}`,e.clientX,e.clientY);return}
  if(e.target.matches('rect[data-lc]')){const o=LC[e.target.dataset.lc],svg=e.target.ownerSVGElement,p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse()),i=Math.max(0,Math.min(o.x1-o.x0,Math.round((q.x-o.ox)/o.w*(o.x1-o.x0)))),X=o.ox+i/(o.x1-o.x0)*o.w;
    const g=svg.querySelector('.xh');g.style.opacity=1;g.querySelector('line').setAttribute('x1',X);g.querySelector('line').setAttribute('x2',X);
    g.querySelectorAll('circle').forEach(c=>{const se=o.series[+c.dataset.k];c.setAttribute('cx',X);c.setAttribute('cy',o.oy+o.h-se.v[i]/o.ymax*o.h)});
    showTip(`<b>${o.x0+i}</b>Korea ${o.vfmt(o.series[2].v[i])}<br>Mexico ${o.vfmt(o.series[1].v[i])}`,e.clientX,e.clientY);return}
  hideTip()});
stage.addEventListener('mouseleave',hideTip);
stage.addEventListener('click',e=>{if(e.target.closest('[data-tip],rect[data-lc]'))return;e.clientX<innerWidth*.25?go(cur-1):next()});
document.querySelectorAll('#zc').forEach(zFinal);document.querySelectorAll('#zi').forEach(ziFinal);
go((parseInt(location.hash.slice(1))||1)-1);
</script>
