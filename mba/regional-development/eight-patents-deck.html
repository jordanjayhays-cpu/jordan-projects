<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Patents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --card:#f9f8f5; --band:#e9e5dd; --line:#dcd8d0;
  --ink:#1c1a17; --ink2:#4a4640; --mute:#8a857c; --faint:#bdb7ad;
  --kor:#1f6fd1; --mex:#c8541f; --gtm:#6a3fc1;
  --n1:#2f2c28; --n2:#8f897f; --n3:#d6d1c7;
  --spring:cubic-bezier(.3,1.6,.5,1); --out:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9d5cc;font-family:Archivo,system-ui,sans-serif;color:var(--ink);overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1334px;height:750px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;overflow:hidden;
  transform:translateX(40px);transition:opacity .4s var(--out),transform .6s cubic-bezier(.25,1.25,.4,1)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-40px)}
.cap{font-family:"Archivo Narrow",sans-serif;font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--mute)}
.it{font-family:Newsreader,serif;font-style:italic;font-weight:400;color:var(--ink)}
.card{position:absolute;left:72px;top:73px;width:378px;height:563px;background:var(--card);border:1px solid var(--line);padding:36px 28px 28px}
.card h2{font-weight:800;font-size:40px;line-height:1.02;letter-spacing:-.035em;margin:14px 0 12px}
.card .sub{font-size:16.5px;line-height:1.45;color:var(--ink2);padding-bottom:16px;border-bottom:1px solid var(--line)}
.card .big{font-weight:900;font-size:84px;letter-spacing:-.04em;line-height:1;margin:16px 0 14px;font-variant-numeric:tabular-nums}
.card .bigt{font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.05;margin:18px 0 14px}
.card .bl{font-family:"Archivo Narrow",sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--mute);line-height:1.6}
.card .kt{font-family:"Archivo Narrow",sans-serif;font-weight:700;letter-spacing:.14em;font-size:12.5px;margin-top:18px;color:var(--ink)}
.card .kx{font-size:14px;line-height:1.45;color:var(--mute);margin-top:6px}
.right{position:absolute;left:495px;top:73px;width:767px;height:563px}
.foot{position:absolute;left:0;right:0;bottom:0;height:42px;background:var(--band);display:flex;align-items:center;padding:0 72px;
  font-family:"Archivo Narrow",sans-serif;font-size:13px;color:var(--mute);letter-spacing:.02em}
.prog{position:absolute;right:72px;bottom:64px;display:flex;align-items:center;gap:5px}
.prog i{display:block;height:3px;width:40px;background:var(--line);position:relative;overflow:hidden}
.prog i.a::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.slide.on .prog i.a::after{animation:bar .9s var(--out) .2s both}
.prog span{font-family:"Archivo Narrow",sans-serif;font-size:13px;color:var(--mute);letter-spacing:.12em;margin-left:6px}
.aside{position:absolute;font-family:Newsreader,serif;font-style:italic;font-size:25px;line-height:1.25;color:var(--ink)}
.rule{position:absolute;height:1px;background:var(--line);transform-origin:left}
svg{overflow:visible}
svg text{font-family:"Archivo Narrow",sans-serif}
.ph{background:#fbe7a6;padding:0 4px}
#nav{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:5;opacity:.35;transition:opacity .2s}#nav:hover{opacity:1}
#nav button{font:600 13px "Archivo Narrow",sans-serif;letter-spacing:.1em;border:0;background:rgba(28,26,23,.82);color:#fff;
  padding:9px 14px;border-radius:999px;cursor:pointer;transition:transform .18s var(--spring)}
#nav button:active{transform:scale(.88);transition-duration:.06s}
#tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:#fff;font:500 14px/1.4 Archivo,sans-serif;
  padding:8px 11px;border-radius:6px;opacity:0;transform:translateY(6px) scale(.96);transition:opacity .15s,transform .25s var(--spring);white-space:nowrap}
#tip.show{opacity:1;transform:none}
#tip b{font-family:"Archivo Narrow";letter-spacing:.08em;text-transform:uppercase;font-size:12px;display:block;opacity:.7}
[data-tip]{cursor:default}
.hov{transition:transform .25s var(--spring),opacity .2s}
.hov:hover{transform:scale(1.25)}

/* ---------- motion: everything replays each time a slide is entered ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flow{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
@keyframes stream{from{transform:translateX(-19.5px)}to{transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes wallgo{from{opacity:1}to{opacity:.22}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.r,.pop,.draw,.fade,.grow,.growy{will-change:transform,opacity}
.pop,.pulse{transform-box:fill-box;transform-origin:center}
.grow{transform-origin:left center;transform-box:fill-box}
.growy{transform-origin:center bottom;transform-box:fill-box}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.on .r{animation:rise .75s var(--out) both;animation-delay:var(--t,calc(var(--i,0)*90ms + 150ms))}
.slide.on .pop{animation:pop .55s var(--spring) both;animation-delay:var(--t,0ms)}
.slide.on .draw{animation:draw var(--dur,1.4s) cubic-bezier(.45,0,.2,1) both;animation-delay:var(--t,200ms)}
.slide.on .fade{animation:fade var(--dur,.9s) ease both;animation-delay:var(--t,0ms)}
.slide.on .grow{animation:grow var(--dur,.9s) cubic-bezier(.25,1.2,.4,1) both;animation-delay:var(--t,0ms)}
.slide.on .growy{animation:growy .8s var(--spring) both;animation-delay:var(--t,0ms)}
.slide.on .flow{animation:flow .8s linear infinite}
.slide.on .stream{animation:stream .5s linear infinite;animation-delay:var(--t,0ms)}
.slide.on .pulse{animation:pulse 1.6s ease-in-out infinite;animation-delay:var(--t,0ms)}
.slide.on .wallgo{animation:wallgo 1.1s ease both;animation-delay:var(--t,0ms)}
.slide.on .rule.r{animation:grow .9s var(--out) both;animation-delay:var(--t,calc(var(--i,0)*90ms + 150ms))}
@media (prefers-reduced-motion:reduce){
  .slide,.slide *{animation:none!important;transition:none!important}
  .draw{stroke-dashoffset:0}
  .prog i.a::after{transform:none}
}
@media print{
  @page{size:1334px 750px;margin:0}
  html,body{overflow:visible;background:var(--bg)}
  #viewport{position:static;display:block}
  #stage{transform:none!important;width:auto;height:auto}
  .slide{position:relative;opacity:1;transform:none;width:1334px;height:750px;page-break-after:always;break-after:page}
  .slide *{animation:none!important}
  .draw{stroke-dashoffset:0}
  .prog i.a::after{transform:none}
  #nav,#tip{display:none}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="nav"><button id="pv" aria-label="Previous slide">‹</button><button id="nx" aria-label="Next slide">›</button></div>

<script>
// ---------- Data: World Bank WDI, pulled 11 Nov 2026 via api.worldbank.org ----------
const D={"pat":{"KOR":[1241,1319,1556,1599,1997,2702,3640,4871,5696,7020,9082,13253,15951,21449,28554,59228,68405,67359,50596,55970,72831,73714,76570,90313,105250,122188,125476,128701,127114,127316,131805,138034,148136,159978,164073,167275,163424,159084,162561,171603,180477,186245,183748,191142,195786],"MEX":[704,765,550,730,688,590,629,742,652,757,661,564,565,553,498,432,386,420,453,455,431,534,526,468,565,584,574,629,685,822,951,1065,1294,1210,1246,1364,1310,1334,1555,1305,1132,1117,983,978,1172],"BRA":[2149,2171,2116,2302,2062,1954,1855,2451,2338,2323,2389,2319,2100,2429,2269,2707,2611,2756,2491,2816,3179,3439,3481,3866,4044,4054,3956,4194,4280,4271,4228,4695,4798,4959,4659,4641,5200,5480,4980,5464,5280,4666,4398,4973,5752]},"gdp":{"KOR":[1038,1077,1088,1153,1229,1286,1405,1498,1657,1856,2001,2171,2287,2583,2784,2955,3294,3645,3987,4270,4140,4378,4676,5228,5713,6106,6741,7535,8367,8878,9673,10619,11177,11837,12817,13924,14894,15682,14801,16403,17763,18460,19775,20278,21245,22124,23162,24392,24935,25010,26623,27393,27944,28733,29471,30172,31005,31980,32853,33496,33216,34793,35809,36348,37048],"MEX":[4146,4219,4276,4475,4846,5021,5154,5278,5589,5596,5775,5809,6099,6385,6559,6741,6845,6889,7310,7815,8290,8875,8677,8099,8208,8194,7714,7716,7658,7784,8037,8197,8330,8412,8623,7971,8321,8771,9162,9265,9582,9398,9242,9222,9421,9492,9814,9878,9826,9074,9389,9576,9783,9739,9862,10021,10101,10194,10297,10159,9235,9728,10013,10235,10284],"BRA":[2604,2743,2838,2773,2785,2773,2879,2921,3127,3339,3596,3907,4268,4748,5014,5149,5543,5680,5821,6069,6473,6055,5968,5665,5842,6168,6494,6592,6463,6545,6150,6108,5974,6167,6427,6596,6641,6765,6687,6622,6818,6823,6945,6941,7259,7410,7622,8003,8331,8246,8793,9068,9167,9367,9338,8936,8578,8628,8722,8771,8435,8799,9032,9288,9567],"GTM":[1885,1908,1918,2040,2074,2102,2156,2183,2309,2355,2425,2495,2609,2715,2816,2802,2945,3106,3181,3249,3287,3226,3042,2892,2826,2730,2659,2678,2706,2735,2742,2766,2824,2857,2894,2958,2968,3019,3090,3129,3166,3166,3213,3222,3250,3285,3388,3528,3570,3516,3547,3621,3656,3717,3810,3894,3925,3973,4040,4139,4006,4269,4384,4469,4564]}};
const C={kor:'#1f6fd1',mex:'#c8541f',gtm:'#6a3fc1',ctx:'#bdb7ad',ink:'#1c1a17',ink2:'#4a4640',n1:'#2f2c28',n2:'#8f897f',n3:'#d6d1c7',mute:'#8a857c',line:'#dcd8d0',faint:'#bdb7ad'};
const fmt=(v,d=0)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- Helpers ----------
const SECTIONS=['Context','Diagnostic','Benchmarks','Recommendations','Conclusion'];
// count-up number: renders final value (print / reduced motion), JS animates from zero on entry
const num=(to,{dec=0,pre='',suf='',t=450,from=0,dur=1100}={})=>`<span data-to="${to}" data-from="${from}" data-dur="${dur}" data-dec="${dec}" data-pre="${pre}" data-suf="${suf}" data-t="${t}">${pre}${fmt(to,dec)}${suf}</span>`;
function card(o){return `<div class="card">
 <div class="cap r" style="--i:0">${o.kicker}</div>
 <h2 class="r" style="--i:1">${o.title}</h2>
 <div class="sub r" style="--i:2">${o.sub}</div>
 ${o.big?`<div class="big r" style="--i:3;color:${o.color||C.ink}">${o.big}</div>`:''}
 ${o.bigt?`<div class="bigt r" style="--i:3;color:${o.color||C.ink}">${o.bigt}</div>`:''}
 <div class="bl r" style="--i:4">${o.label||''}</div>
 ${o.key?`<div class="kt r" style="--i:5">${o.keyTitle||'KEY'}</div><div class="kx r" style="--i:5">${o.key}</div>`:''}
</div>`}
// dots pop in one after another: t0 = start (ms), st = stagger (ms)
function dotRow(n,{x=0,y=0,p=19.5,r=8,color=C.ink,hollow=false,max=Infinity,t0=300,st=30,tip=''}={}){
  let s='';const m=Math.min(Math.ceil(n),max);
  for(let i=0;i<m;i++){const T=`style="--t:${t0+i*st}ms"`,dt=tip?` data-tip="${tip}"`:'';
    s+=hollow?`<circle class="pop" ${T}${dt} cx="${x+i*p+r}" cy="${y}" r="${r-1}" fill="none" stroke="${color}" stroke-width="1.6"/>`
    :`<circle class="pop" ${T}${dt} cx="${x+i*p+r}" cy="${y}" r="${r}" fill="${color}"/>`}
  return s}
function dotGrid(n,{x=0,y=0,cols=10,p=28,r=11,color=C.ink,t0=300,st=18,tip=''}={}){
  let s='';for(let i=0;i<n;i++){const cx=x+(i%cols)*p+r,cy=y+Math.floor(i/cols)*p+r;
   s+=`<circle class="pop" style="--t:${t0+i*st}ms"${tip?` data-tip="${tip}"`:''} cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`}return s}
const LC={};let lcN=0;
// line chart: lines draw themselves, labels land at the end of each line, hover shows the year
function lineChart(series,{x0,x1,w=600,h=230,ymax,yticks,yfmt,vfmt,ox=40,oy=30}){
  const id='lc'+(lcN++);const X=i=>ox+i/(x1-x0)*w, Y=v=>oy+h-v/ymax*h;
  LC[id]={series,x0,x1,w,h,ymax,ox,oy,vfmt};
  let s='';
  yticks.forEach((t,k)=>{s+=`<line class="fade" style="--t:${100+k*60}ms" x1="${ox}" x2="${ox+w}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C.line}" stroke-width="1"/>`;
    if(t>0)s+=`<text class="fade" style="--t:${100+k*60}ms" x="${ox-8}" y="${Y(t)+4}" text-anchor="end" font-size="12" fill="${C.mute}">${yfmt(t)}</text>`});
  s+=`<line x1="${ox}" x2="${ox+w}" y1="${Y(0)}" y2="${Y(0)}" stroke="${C.faint}" stroke-width="1.2"/>`;
  s+=`<text x="${ox}" y="${Y(0)+22}" font-size="12" fill="${C.mute}">${x0}</text><text x="${ox+w}" y="${Y(0)+22}" text-anchor="end" font-size="12" fill="${C.mute}">${x1}</text>`;
  [...series].sort((a,b)=>(a.hi?1:0)-(b.hi?1:0)).forEach(se=>{
    const pts=se.v.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const t=se.hi?500:250, dur=se.hi?(se.slow?2200:1700):1300, end=t+dur;
    if(se.area)s+=`<polygon class="fade" style="--t:${end-300}ms;--dur:1s" points="${X(0)},${Y(0)} ${pts} ${X(se.v.length-1)},${Y(0)}" fill="${se.c}" fill-opacity=".09"/>`;
    s+=`<polyline class="draw" pathLength="1" style="--t:${t}ms;--dur:${dur}ms" points="${pts}" fill="none" stroke="${se.c}" stroke-width="${se.hi?2.6:1.4}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lx=X(se.v.length-1),ly=Y(se.v[se.v.length-1]);
    if(se.hi)s+=`<circle class="pop" style="--t:${end}ms" cx="${lx}" cy="${ly}" r="4.5" fill="${se.c}"/>`;
    s+=`<g class="r" style="--t:${end}ms"><text x="${lx+12}" y="${ly+(se.dy||0)-3}" font-size="15" font-weight="700" letter-spacing=".04em" fill="${se.c}">${se.name}</text>
        <text x="${lx+12}" y="${ly+(se.dy||0)+14}" font-size="14" font-weight="600" fill="${se.hi?C.ink:C.mute}">${se.end}</text></g>`;
  });
  s+=`<g class="xh" data-lc="${id}" style="opacity:0;transition:opacity .15s"><line x1="0" x2="0" y1="${oy}" y2="${oy+h}" stroke="${C.ink}" stroke-width="1" stroke-dasharray="3 3"/>
      ${series.filter(se=>se.hi).map((se,k)=>`<circle data-k="${series.indexOf(se)}" r="5" fill="${se.c}" stroke="#fff" stroke-width="2"/>`).join('')}</g>
     <rect data-lc="${id}" x="${ox}" y="${oy}" width="${w}" height="${h}" fill="transparent" style="cursor:crosshair"/>`;
  return s}

// ---------- Slides ----------
const S=[];

// 1 Title
S.push({sec:-1,html:`<div class="cap r" style="--i:0;position:absolute;left:72px;top:66px">For the Inter-American Development Bank · Subregion: Mexico and Central America</div>
<div class="rule r" style="--i:1;left:72px;right:72px;top:104px"></div>
<div class="r" style="--i:2;position:absolute;left:68px;top:136px;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.05em">Eight<br>patents</div>
<div class="r" style="--i:4;position:absolute;left:72px;top:432px;font-size:24px;line-height:1.4;color:var(--ink2);width:700px">What Mexico and Central America stopped buying, and what it cost them</div>
<svg style="position:absolute;left:72px;top:518px" width="560" height="40">${dotRow(8,{y:20,p:72,r:14,color:C.gtm,t0:900,st:170})}</svg>
<div class="it r" style="--t:2400ms;position:absolute;left:650px;top:505px;font-size:23px">a whole country’s output of new ideas, 2024</div>
<div class="rule r" style="--t:600ms;left:72px;right:72px;top:652px"></div>
<div class="cap r" style="--t:800ms;position:absolute;left:72px;top:676px;letter-spacing:.06em;text-transform:none;font-size:14px">Group 1 · <span class="ph">[Big Four firm]</span> · prepared for the IDB · IE University</div>
<div class="cap r" style="--t:800ms;position:absolute;right:72px;top:676px;letter-spacing:.06em;text-transform:none;font-size:14px">12 November 2026</div>`,noFoot:true});

// 2 Executive summary
S.push({sec:-1,src:'All figures World Bank WDI, cited on each slide · programmes detailed on slides 14 to 18',
html:card({kicker:'Executive summary',title:'Growth stalled: the region never bought the ability to invent.',
 sub:'Mexico and Korea started level in 1980. One paid for research for forty years. The other did not.',
 bigt:'One country.<br>This year.',color:C.kor,label:'Our ask of the IDB'})+
`<div class="right">
 <div class="cap r" style="--t:500ms;margin-top:56px">What we found</div>
 <div class="rule r" style="--t:550ms;position:relative;margin:14px 0 18px"></div>
 <div class="r" style="--t:650ms;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2">Guatemala filed <span style="color:${C.gtm}">${num(8,{t:800})}</span> patents in 2024. Korea filed <span style="color:${C.kor}">${num(195786,{t:900})}</span>.</div>
 <div class="r" style="--t:800ms;font-size:18px;color:var(--ink2);margin-top:12px;line-height:1.45">Low research spending, few researchers, capitals that drain their regions, and payroll taxes that keep firms small.</div>
 <div class="cap r" style="--t:1300ms;margin-top:56px">What we recommend</div>
 <div class="rule r" style="--t:1350ms;position:relative;margin:14px 0 18px"></div>
 <div class="r" style="--t:1450ms;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2">Fund a capability agency in one country, then two follow-on programmes over ten years.</div>
 <div class="r" style="--t:1600ms;font-size:18px;color:var(--ink2);margin-top:12px;line-height:1.45">Judged on three counts published every year. No growth number promised.</div>
</div>`});

// 3 Context 1: income
const XC=52+28/64*580, YC=24+250-8000/40000*250;
S.push({sec:0,src:'Income per person, constant 2015 US$, 1960 to 2024 · World Bank WDI, NY.GDP.PCAP.KD · retrieved 11 Nov 2026',
html:card({kicker:'Regional context · 1 of 3',title:'In 1960 Mexico was four times richer than Korea.',
 sub:'Income per person, 1960 to 2024.',big:num(3.6,{dec:1,suf:'×',t:900}),color:C.kor,label:'Korea’s income per person against Mexico’s, 2024',
 key:'Constant 2015 US dollars, so this is real income, not prices. Brazil and Guatemala in grey for context. Hover the chart for any year.'})+
`<div class="right"><div class="cap r" style="--i:1;margin:72px 0 0 20px">GDP per person, constant 2015 US$</div>
<svg width="767" height="330" style="margin-top:10px">${lineChart([
 {v:D.gdp.BRA,c:C.ctx,name:'BRAZIL',end:'$9,567',dy:22},
 {v:D.gdp.GTM,c:C.ctx,name:'GUATEMALA',end:'$4,564',dy:31},
 {v:D.gdp.MEX,c:C.mex,name:'MEXICO',end:'$10,284',hi:1,dy:-16},
 {v:D.gdp.KOR,c:C.kor,name:'KOREA',end:'$37,048',hi:1,area:1}],
 {x0:1960,x1:2024,w:580,h:250,ymax:40000,yticks:[0,10000,20000,30000,40000],yfmt:t=>'$'+t/1000+'k',vfmt:v=>'$'+fmt(v),ox:52,oy:24})}
 <circle class="pop" style="--t:1500ms" cx="${XC}" cy="${YC}" r="7" fill="none" stroke="${C.ink}" stroke-width="1.6"/>

// ---------- Render ----------
const stage=document.getElementById('stage');const N=S.length;
stage.innerHTML=S.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}
${s.sec>=0?`<div class="prog">${SECTIONS.map((_,k)=>`<i class="${k===s.sec?'a':''}"></i>`).join('')}<span>${String(i+1).padStart(2,'0')} / ${N}</span></div>`:
 (i>0?`<div class="prog"><span>${String(i+1).padStart(2,'0')} / ${N}</span></div>`:'')}
${s.noFoot?'':`<div class="foot">${s.src}</div>`}</section>`).join('')+`<div id="tip"></div>`;
const els=[...stage.querySelectorAll('.slide')];let cur=0,scale=1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

// count-up for every number on the slide being entered
let raf=[];
function countUp(sl){raf.forEach(cancelAnimationFrame);raf=[];
  sl.querySelectorAll('[data-to]').forEach(el=>{const to=+el.dataset.to,from=+el.dataset.from||0,dec=+el.dataset.dec,pre=el.dataset.pre,suf=el.dataset.suf,delay=+el.dataset.t,dur=+el.dataset.dur||1100;
    const final=pre+fmt(to,dec)+suf; if(RM){el.textContent=final;return}
    el.textContent=pre+fmt(from,dec)+suf;const t0=performance.now()+delay;
    const step=now=>{const k=Math.min(1,Math.max(0,(now-t0)/dur)),e=1-Math.pow(1-k,3);
      el.textContent=pre+fmt(from+(to-from)*e,dec)+suf; if(k<1)raf.push(requestAnimationFrame(step)); else el.textContent=final};
    raf.push(requestAnimationFrame(step))})}
function go(n){const nx=Math.max(0,Math.min(N-1,n));cur=nx;
  els.forEach((e,i)=>{e.classList.toggle('on',i===cur);e.classList.toggle('prev',i<cur)});
  countUp(els[cur]);hideTip();if(S[cur].zoom)zoomAnim(els[cur]);else cancelAnimationFrame(zRaf);
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function fit(){scale=Math.min(innerWidth/1334,innerHeight/750);stage.style.transform=`scale(${scale})`}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==='Home')go(0);if(e.key==='End')go(N-1)});
document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('pv').onclick=()=>go(cur-1);

// tooltips: dots carry data-tip, line charts show every series for the hovered year
const tip=document.getElementById('tip');
function showTip(html,cx,cy){const r=stage.getBoundingClientRect();tip.innerHTML=html;
  let x=(cx-r.left)/scale+14,y=(cy-r.top)/scale-48;tip.classList.add('show');
  const w=tip.offsetWidth; if(x+w>1320)x-=w+28; tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px'}
function hideTip(){tip.classList.remove('show');stage.querySelectorAll('.xh').forEach(g=>g.style.opacity=0)}
stage.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');
  if(t){const[a,...b]=t.dataset.tip.split(' · ');showTip(`<b>${a}</b>${b.join(' · ')}`,e.clientX,e.clientY);return}
  if(e.target.matches('rect[data-lc]')){const o=LC[e.target.dataset.lc],svg=e.target.ownerSVGElement;
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
    const i=Math.max(0,Math.min(o.x1-o.x0,Math.round((q.x-o.ox)/o.w*(o.x1-o.x0)))),X=o.ox+i/(o.x1-o.x0)*o.w;
    const g=svg.querySelector(`.xh[data-lc="${e.target.dataset.lc}"]`);g.style.opacity=1;
    g.querySelector('line').setAttribute('x1',X);g.querySelector('line').setAttribute('x2',X);
    g.querySelectorAll('circle').forEach(c=>{const se=o.series[+c.dataset.k];c.setAttribute('cx',X);c.setAttribute('cy',o.oy+o.h-se.v[i]/o.ymax*o.h)});
    showTip(`<b>${o.x0+i}</b>${o.series.filter(s=>s.hi).reverse().map(s=>`<span style="color:${s.c==='#c8541f'?'#f0a07a':'#8fb8f0'}">●</span> ${s.name[0]+s.name.slice(1).toLowerCase()} ${o.vfmt(s.v[i])}`).join('<br>')}`,e.clientX,e.clientY);return}
  hideTip()});
stage.addEventListener('mouseleave',hideTip);
// dots with tooltips grow slightly under the pointer
stage.querySelectorAll('circle[data-tip]').forEach(c=>{c.addEventListener('mouseenter',()=>{c.style.transition='r .25s cubic-bezier(.3,1.6,.5,1)';c.dataset.r0=c.dataset.r0||c.getAttribute('r');c.setAttribute('r',+c.dataset.r0*1.3)});
  c.addEventListener('mouseleave',()=>c.setAttribute('r',c.dataset.r0))});
// click anywhere on the slide (not on a chart) to advance, like a clicker
stage.addEventListener('click',e=>{if(e.target.closest('[data-tip],rect[data-lc],a,button'))return;go(cur+(e.clientX<innerWidth*0.25?-1:1))});
document.querySelectorAll('#zc').forEach(zFinal);
go((parseInt(location.hash.slice(1))||1)-1);
</script>
